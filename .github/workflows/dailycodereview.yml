name: Daily Code Review Tracker

# Runs a full-codebase review every day and keeps the code-review backlog in sync as
# ordinary GitHub Issues — one issue per item, so each can be closed, assigned, discussed
# and closed from a PR with "Fixes #N". `label:code-review` is the running list; there is
# no index issue, because the issue list already is one and a second copy would drift.
#
# 13:00 UTC = 15:00 Europe/Budapest (summer) / 14:00 (winter), so it lands
# comfortably before 17:00 local even if GitHub delays the scheduled run.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: daily-code-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A subscription token (`sk-ant-oat…`, from `claude setup-token`) is not an API key
          # and must arrive on this input — handed to anthropic_api_key it is rejected at auth.
          # The `||` accepts either secret name: an unset secret is the empty string, so the
          # first truthy one wins. Collapse it to whichever name you kept once you know.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          # If a run ever goes green having written nothing, add `show_full_output: true` here and
          # re-dispatch. The SDK stream is hidden by default and that silence is exactly what made
          # the first two failures undiagnosable. Left off so the daily run does not copy the whole
          # review into logs that are public on this repo.
          # Task/Agent are refused outright, not just discouraged in the prompt: a background
          # agent's findings die with the process at end of turn, and that failure is silent —
          # the run goes green having written nothing. One agent, one turn, everything inline.
          claude_args: >-
            --allowedTools "Write,Read,Grep,Glob,Bash(gh:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(sed:*),Bash(sort:*),Bash(uniq:*),Bash(comm:*),Bash(diff:*),Bash(head:*),Bash(tail:*)"
            --disallowedTools "Task,Agent"
            --max-turns 120
          prompt: |
            You maintain this repository's code-review backlog as ordinary GitHub Issues —
            one issue per item. You run once per day. Your job is to reconcile that backlog
            with the current state of the code: close what is done, file what is new, and
            leave everything else alone. You are not writing a report.

            Two kinds of item, and they never mix:
              FINDING — a defect worth fixing.
              IDEA    — a feature or improvement worth building.

            The repository is checked out in the current working directory. Read CLAUDE.md
            first: it documents the architecture and the project's own rules. Anything that
            contradicts a documented deliberate decision is NOT a finding and NOT an idea.
            This codebase documents many things it has deliberately chosen *not* to do, and
            the reasoning behind each; proposing one of them back is the single most likely
            way for this job to waste everyone's time. If CLAUDE.md says a thing was removed,
            rejected, or is absent by design, it stays absent.

            ## Step 1 — Make sure the labels exist

            Every label is created up front, because `gh issue create --label` fails outright
            on a label that does not exist, and that failure would look like a broken run.
            Already-exists errors are expected and ignored:

              gh label create code-review   --color 0E8A16 --description "Filed by the daily review job" 2>/dev/null || true
              gh label create severity:high --color B60205 --description "Code review: high severity" 2>/dev/null || true
              gh label create severity:medium --color D93F0B --description "Code review: medium severity" 2>/dev/null || true
              gh label create severity:low  --color FBCA04 --description "Code review: low severity" 2>/dev/null || true
              gh label create idea          --color 1D76DB --description "Feature or improvement worth building" 2>/dev/null || true
              gh label create cr-auto-closed --color C5DEF5 --description "Closed by the review job, not by a human" 2>/dev/null || true

            ## Step 2 — Read the existing backlog

              gh issue list --label code-review --state all --limit 300 \
                --json number,title,body,state,labels,url

            Read OPEN and CLOSED alike. The closed ones are what stops you re-filing work
            that is already done or already refused.

            **Identity.** Every issue you create ends its body with an identity marker on
            its own final line:

              <!-- cr-key: <path> | <slug> -->

            `<path>` is the primary file or directory the item is about, and `<slug>` is a
            short kebab-case description of the claim (`clip-dir-never-cleaned`). Line
            numbers are never part of the key — they drift with every edit, and an item
            whose identity drifts gets filed twice. Choose a key you would generate again
            tomorrow from the same observation.

            ## Step 3 — Verify every OPEN item

            For each open issue, go look at the code it points to and decide:

              - STILL PRESENT (finding) / STILL WANTED (idea) -> leave it completely alone.
                Do not comment. Do not edit it. An untouched issue is the normal case and
                should stay silent; a job that comments daily on unchanged items is noise.
              - FIXED (the defect is gone) / BUILT (the idea shipped) ->
                  gh issue close <n> --reason completed \
                    --comment "Verified fixed: <what changed, and where you looked>."
                then: gh issue edit <n> --add-label cr-auto-closed
              - NO LONGER VALID (it was wrong, or the code it described is gone) ->
                  gh issue close <n> --reason "not planned" \
                    --comment "Withdrawn: <why this is no longer a real item>."
                then: gh issue edit <n> --add-label cr-auto-closed

            If the line numbers in an issue have drifted but the item is still real, update
            the body to the current lines. That is the one edit worth making to an unchanged
            item, because a stale line reference sends the next reader to the wrong place.

            ## Step 4 — Review the whole codebase for new findings

            Review the entire codebase, not just recent changes. Look for:
              - Correctness bugs, logic errors, unhandled edge cases
              - Race conditions, resource/handle leaks, missing cleanup
              - Security issues (command injection, unsafe IPC, path traversal, secret handling)
              - Error handling gaps and swallowed failures
              - Type-safety holes (`any`, unchecked casts, non-null assertions covering real risk)
              - Dead code, duplication, and structural/maintainability problems
              - Style and consistency drift from the conventions in CLAUDE.md

            Quality bar: only report things a competent reviewer would actually act on.
            No nitpicks, no "consider adding a comment", no speculative refactors.
            Every finding must name a specific file and line range and state the concrete
            consequence — what actually goes wrong, and when.

            ## Step 5 — Look for features and improvements worth building

            Separately from the defects above, look for work that would make this a better
            app or a better codebase. Consider:
              - Features the app plausibly wants next, judged from what it already does
              - Rough edges in existing behaviour — things that work but are awkward to use
              - Architectural improvements that would remove a whole class of future bugs
              - Performance and resource wins worth the change they require

            Quality bar, deliberately high: an idea earns a place only if you can name where
            it would go, say concretely what it would do, and say why it is worth doing for
            THIS app. Generic engineering advice — "add tests", "improve error handling",
            "adopt stricter types" — is not an idea. Neither is anything CLAUDE.md rules out.

            A defect is a finding and never an idea. If you catch yourself filing a nitpick
            as a low-severity finding to avoid deciding, it is neither — drop it.

            Cap the OPEN `idea` issues at 10. If you have a new one and the cap is reached,
            it earns its place only by being better than the weakest idea already open — in
            which case close that one (`--reason "not planned"`, `cr-auto-closed`, comment
            saying it was displaced) and file the new one. A backlog nobody can read is a
            backlog nobody uses.

            ## Step 6 — File what is genuinely new

            For every finding and idea from Steps 4 and 5, compute its `cr-key` and match it
            against the backlog you read in Step 2. Then, and only then:

              - Matches an OPEN issue -> already tracked. Do nothing at all.
              - Matches an issue closed WITH the `cr-auto-closed` label -> you closed this
                yourself. If the defect has genuinely returned, REOPEN that same issue
                (`gh issue reopen <n>`), remove the label (`--remove-label cr-auto-closed`)
                and comment that it regressed. Never file a second issue for it.
              - Matches an issue closed WITHOUT that label -> a human closed it. That is a
                decision, and it is permanent. Never re-file it, never reopen it, never
                comment on it. This rule outranks your own judgement about whether the item
                is real.
              - No match -> file it.

            Filing an issue:

              Title: one plain sentence naming the thing. No ID prefix, no severity prefix —
              severity is a label, and GitHub renders labels.

              Body (write to a file under /tmp with the Write tool, pass with --body-file;
              /tmp is the only place you may write — never write inside the checkout):

              ```
              `src/main/clipboard.ts:11-28`

              What: one-line statement of the defect, or of the proposal.

              Why it matters: the concrete consequence — what actually goes wrong and
              under what conditions. For an idea: what it gets you, and when it would
              matter.

              _Found by the daily review job on YYYY-MM-DD._

              <!-- cr-key: src/main/clipboard.ts | clip-dir-never-cleaned -->
              ```

              Findings:  gh issue create --title "..." --body-file /tmp/item.md \
                           --label code-review --label severity:high
              Ideas:     gh issue create --title "..." --body-file /tmp/item.md \
                           --label code-review --label idea

            ## Step 7 — Write the run summary

            Write `/tmp/run-summary.md` with the Write tool. A later workflow step publishes
            it to the run summary — this is the "what changed today" view, and it goes there
            rather than into a comment so that an unchanged backlog makes no noise at all.

            ```
            ### Daily review — YYYY-MM-DD

            | | |
            |---|---|
            | Closed as fixed | #12, #14 |
            | Closed as withdrawn | — |
            | Reopened (regressed) | — |
            | New findings | #31 stale container handle |
            | New ideas | #32 jump-to-latest button in ChatView |
            | Open now | 6 findings · 4 ideas |
            ```

            Write it even when nothing changed — a summary saying nothing changed is the
            evidence the job ran and looked.

            ## Rules

            - This is an unattended run. Never ask questions. Make the call and proceed.
            - **Do the whole review yourself, in this one turn.** Never delegate to background
              agents. This is a single `claude -p` process: when your turn ends the process
              exits, so anything still running in the background is killed and its findings
              are lost. Ending your turn to "wait for results" ends the job having done
              nothing. Your turn ends only after the backlog is reconciled.
            - **Never touch an issue that is not labelled `code-review`.** Other issues in
              this repository are not yours.
            - Do not open pull requests, do not modify any repository files, do not push.
              Your only writes are to issues, their labels, and their comments.
            - Prefer doing nothing to doing something twice. A duplicate issue is worse than
              a missed one: the missed finding shows up tomorrow, the duplicate has to be
              cleaned up by hand.
            - If `gh` fails, retry once, then report the exact error as your final output.

      # Published by a plain shell step rather than by the agent: appending to
      # $GITHUB_STEP_SUMMARY needs a redirect, and the agent's Bash allowlist matches on
      # command prefixes, so a redirect inside a compound command is the kind of thing that
      # gets denied mid-run. `always()` so a failed review still reports what it managed.
      - name: Publish run summary
        if: always()
        run: |
          if [ -f /tmp/run-summary.md ]; then
            cat /tmp/run-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_The review job wrote no summary — check the step above._" >> "$GITHUB_STEP_SUMMARY"
          fi
